# R0.1–R0.3 — CPU checks, verified packaging and deterministic regression fixtures.
# Runs on a standard GitHub-hosted Windows runner with no GPU. Nothing here
# creates a window, a graphics device or a software adapter; GPU smokes stay
# local (Tier 3) until a separate, non-blocking Tier 2 experiment proves them.
# See docs/ci.md for behavior and local reproduction.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request cancels its older run. Runs on main
# are never cancelled, so every merge commit gets a complete result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # CI builds from a restored cache; incremental artifacts only add disk use.
  CARGO_INCREMENTAL: "0"
  # Smaller debug info for test binaries (file/line backtraces are kept).
  # Optimization and test behavior are unchanged.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: Format (cargo fmt)
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Match the laptop's line-ending conversion
        run: git config --global core.autocrlf true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: |
          rustup --version
          rustup toolchain install
          rustc -Vv
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check
      - name: Packaging script regression checks (no build)
        shell: pwsh
        run: ./tools/test-windows-packaging.ps1

  test:
    name: Clippy and tests (debug)
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Match the laptop's line-ending conversion
        run: git config --global core.autocrlf true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: |
          rustup --version
          rustup toolchain install
          rustc -Vv
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: debug
          # Only main writes the cache; pull requests restore it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Disk space before build
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}}
      - name: cargo clippy --workspace --all-targets --locked -- -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test --workspace --locked --no-fail-fast
        # Runs even if clippy failed, so one push reports both results.
        if: ${{ !cancelled() }}
        run: cargo test --workspace --locked --no-fail-fast
      - name: Disk space after build
        if: ${{ always() }}
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}}
          if (Test-Path target) { "target: {0:N1} GB" -f ((Get-ChildItem target -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum / 1GB) }

  regression:
    name: Deterministic regression (CPU only)
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      QX_REPLAY_COMPARISON: exact
    steps:
      - name: Match the laptop's line-ending conversion
        run: git config --global core.autocrlf true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: |
          rustup --version
          rustup toolchain install
          rustc -Vv
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: regression-cpu
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify immutable corpus and exact debug/release replays
        shell: pwsh
        run: ./tools/verify-regression-baseline.ps1 -Comparison Exact -MachineLabel github-windows-2025 -OutputDirectory "$env:RUNNER_TEMP/regression-r03"
      - name: Upload numerical regression evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regression-r03-${{ github.sha }}
          path: ${{ runner.temp }}/regression-r03
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Release build and Windows package
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Match the laptop's line-ending conversion
        run: git config --global core.autocrlf true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: |
          rustup --version
          rustup toolchain install
          rustc -Vv
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo build --workspace --release --locked
        # Exactly one Cargo build; records its compiler-artifact and embeds
        # provenance. No second compilation or Cargo invocation in packaging.
        shell: pwsh
        run: ./tools/build-windows.ps1 -ReceiptPath "$env:RUNNER_TEMP/windows-release-build.json"
      - name: Package and verify existing executable (CPU only)
        id: package
        shell: pwsh
        run: |
          $receipt = Get-Content "$env:RUNNER_TEMP/windows-release-build.json" -Raw | ConvertFrom-Json
          $name = "QUANTUM Dynamics-$($receipt.build_info.version)-$($receipt.build_info.source_commit.Substring(0, 12))-windows"
          ./tools/package-windows.ps1 -BuildReceipt "$env:RUNNER_TEMP/windows-release-build.json" -OutputDirectory "$env:RUNNER_TEMP/distribution/$name"
      - name: Upload verified Windows development package
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          # Parent wildcard preserves the versioned top-level folder in the ZIP.
          # The runner creates exactly one package and no separate local ZIP.
          path: ${{ runner.temp }}/distribution/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
          include-hidden-files: true
      - name: Record artifact download
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          "- [Download verified package]($env:ARTIFACT_URL) (14-day retention; GitHub sign-in and repository read access required)" >> $env:GITHUB_STEP_SUMMARY
          "- Artifact archive SHA-256: $env:ARTIFACT_DIGEST" >> $env:GITHUB_STEP_SUMMARY
      - name: Disk space after build
        if: ${{ always() }}
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}}
