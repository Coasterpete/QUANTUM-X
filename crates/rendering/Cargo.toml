[package]
license = "MIT OR Apache-2.0"
name = "qx-rendering"
version = "0.1.0"
edition = "2024"

[dependencies]
qx-geometry = { path = "../qx-geometry" }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "vulkan", "wgsl"] }
winit = "0.30.13"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.30"
egui = { version = "0.37", features = ["default_fonts"] }
egui-winit = { version = "0.37", default-features = false, features = ["clipboard"] }
egui-wgpu = { version = "0.37", default-features = false }
png = "0.18"

