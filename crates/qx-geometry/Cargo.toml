[package]
license = "MIT OR Apache-2.0"
name = "qx-geometry"
version = "0.1.0"
edition = "2024"

[features]
# Research-only immutable source queries; no application/physics wiring.
experimental-graph-source = []

[dependencies]
qx-style = { path = "../qx-style" }
serde.workspace = true
# Already in Cargo.lock through SVG loading; MIT OR Apache-2.0, no I/O/entity resolver.
roxmltree = "0.20"

